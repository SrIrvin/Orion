name: Orión CI/CD 🚀

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build, Test & Package 📦
    runs-on: windows-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restaurar dependencias
      run: dotnet restore Orión.sln

    - name: Compilar Solución (Release)
      run: dotnet build Orión.sln --configuration Release --no-restore

    - name: Ejecutar Pruebas Unitarias 🧪
      run: dotnet test Orión.sln --configuration Release --no-build --verbosity normal

    - name: Publicar Aplicación (Self-Contained)
      run: |
        dotnet publish Orión.DesktopUI/Orión.DesktopUI.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -o ./Publish/App `
          /p:PublishSingleFile=true `
          /p:PublishReadyToRun=true

    - name: Generar Instalador con Inno Setup 🛠️
      uses: Ayofel/innosetup-action@v1.2.2
      with:
        filepath: Instalador_Orion.iss

    - name: Subir Artefactos (Instalador y Binarios) 🚀
      uses: actions/upload-artifact@v4
      with:
        name: Orion-Installer-Build-${{ github.run_number }}
        path: |
          Output/*.exe
          ./Publish/App/*
